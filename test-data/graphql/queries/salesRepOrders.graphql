# name: salesRepOrders
# category: sales-rep
# role: SALES_REP
# purpose: Rep-side orders for a served organization (customer profile Orders section contract)
# required-vars: ORGANIZATION_ID (String — a served org id; source @td(ORG_ACME.id) or captured from salesRepCustomers[0].organizationId)
# optional-vars: STATUSES, CULTURE_NAME
# last-validated: 2026-07-17
# known-issues: (none)
# used-by: SR-GQL-022, SR-GQL-031, SR-GQL-037

query {
  salesRepOrders(organizationId: "{{ORGANIZATION_ID}}", storeId: "B2B-store", cultureName: "en-US", first: 20, sort: "createdDate:desc") {
    totalCount
    items { id number createdDate status statusDisplayValue itemsCount total { amount formattedAmount currency { code symbol } } }
  }
}
