# name: salesRepCustomer
# category: sales-rep
# role: SALES_REP
# purpose: Rep-side detail for a single served organization (customer profile page contract)
# required-vars: ORGANIZATION_ID (String — a served org id; source @td(ORG_ACME.id) or captured from salesRepCustomers[0].organizationId)
# optional-vars: (none)
# last-validated: 2026-08-27
# known-issues: (none)
# used-by: SR-GQL-015, SR-GQL-019, SR-GQL-021, SR-GQL-036

query {
  salesRepCustomer(organizationId: "{{ORGANIZATION_ID}}") {
    organizationId
    organizationName
    accountType
    iconUrl
    phone
    address { line1 city regionName postalCode countryCode }
    primaryContact { id fullName firstName lastName emails phones photoUrl }
  }
}
