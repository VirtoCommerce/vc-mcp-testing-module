<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <!--
    Loyalty mission banner — PER-SKU goal (a grid of featured products).
    Palette is the VCST-5346 brand-palette.css tokens ONLY: primary-500 #f99e24, primary-600 #b46b0f,
    primary-50 #fff8eb, secondary-900 #0d1013, secondary-800 #242b34, accent-400 #25a6d5.
    The grid is deliberately pushed right of x=490 and below y=136 so the points pill (top-left), the
    type label (bottom-left) and the completed badge (top-right) all land on plain ground; the two
    highlighted tiles sit above the darkened lower band.
  -->
  <defs>
    <linearGradient id="ps-ground" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1013"/>
      <stop offset="0.55" stop-color="#242b34"/>
      <stop offset="1" stop-color="#0d1013"/>
    </linearGradient>
    <radialGradient id="ps-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#25a6d5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#25a6d5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ps-hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f99e24"/>
      <stop offset="1" stop-color="#b46b0f"/>
    </linearGradient>
    <linearGradient id="ps-wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8eb" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff8eb" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#ps-ground)"/>
  <circle cx="760" cy="180" r="300" fill="url(#ps-glow)"/>

  <!-- 5 x 2 product tiles: two selected (solid), the rest outlined and fading to the left -->
  <g>
    <!-- row 1 -->
    <rect x="498" y="140" width="112" height="112" rx="16" fill="none" stroke="#f99e24" stroke-opacity="0.28" stroke-width="3"/>
    <rect x="632" y="140" width="112" height="112" rx="16" fill="url(#ps-hot)"/>
    <rect x="766" y="140" width="112" height="112" rx="16" fill="none" stroke="#f99e24" stroke-opacity="0.45" stroke-width="3"/>
    <rect x="900" y="140" width="112" height="112" rx="16" fill="#25a6d5" fill-opacity="0.35"/>
    <rect x="1034" y="140" width="112" height="112" rx="16" fill="none" stroke="#25a6d5" stroke-opacity="0.4" stroke-width="3"/>
    <!-- row 2 -->
    <rect x="498" y="274" width="112" height="112" rx="16" fill="none" stroke="#f99e24" stroke-opacity="0.18" stroke-width="3"/>
    <rect x="632" y="274" width="112" height="112" rx="16" fill="none" stroke="#f99e24" stroke-opacity="0.3" stroke-width="3"/>
    <rect x="766" y="274" width="112" height="112" rx="16" fill="url(#ps-wash)"/>
    <rect x="900" y="274" width="112" height="112" rx="16" fill="none" stroke="#f99e24" stroke-opacity="0.45" stroke-width="3"/>
    <rect x="1034" y="274" width="112" height="112" rx="16" fill="#f99e24" fill-opacity="0.22"/>
  </g>

  <!-- selection ticks on the two solid tiles, drawn in the ground colour so they read at any size -->
  <g fill="none" stroke="#0d1013" stroke-opacity="0.65" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M664 198 l20 20 l36 -42"/>
    <path d="M798 332 l20 20 l36 -42"/>
  </g>

  <!-- connective hairlines: the tiles belong to one goal -->
  <g stroke="#fff8eb" stroke-opacity="0.08" stroke-width="1.5">
    <line x1="688" y1="252" x2="688" y2="274"/>
    <line x1="822" y1="252" x2="822" y2="274"/>
    <line x1="956" y1="252" x2="956" y2="274"/>
    <line x1="1090" y1="252" x2="1090" y2="274"/>
  </g>
</svg>
