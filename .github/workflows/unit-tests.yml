# Runs the unit suite on every PR and every push to main.
#
# WHY THIS EXISTS (VCST-5774 review). Until now NO workflow ran `npm test` — the six existing ones
# all drive QA pipelines (regression, monitoring, auto-fix, suite audit) against the product, never
# this repo's own code. So every guarantee the repo documents as enforced was in fact enforced only
# when a human remembered to run the suite locally:
#
#   - `scripts/unit/mirror-parity.test.mjs`, which CLAUDE.md calls "CI-enforced" byte-identity for
#     the five self-diagnostics containment files. A drift on one surface would have shipped.
#   - the secret-hygiene guards added by VCST-5774 — the checks that keep a credential literal out
#     of a generated .mcp.json. A regression there is silent by construction.
#
# A guard nobody runs is a comment. This is the cheapest thing in that whole change and the one
# that makes the rest of it hold.
name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes an in-flight run on the same ref; main is never cancelled.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # Two legs on purpose. The suite has only ever run on Windows — that is where the team develops
    # and where it is known green — so `windows-latest` is the honest signal today. `ubuntu-latest`
    # is added because a suite that only passes on one OS is a portability bug waiting to surface,
    # and this is the first time it has ever run anywhere but a developer's machine: a red Linux leg
    # on the first run would be a genuine finding, not a regression from this PR.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, NOT the 20 the other workflows pin. `npm test` is
          # `tsx --test "scripts/unit/**/*.test.mjs"`, and glob expansion in Node's test runner
          # landed in Node 21 — on 20 the pattern is taken as a literal path and the run dies with
          # `Could not find '…/**/*.test.mjs'` before a single test executes. Copying '20' from the
          # neighbouring workflows (which never run the suite) is exactly how this first run went
          # red on both legs. Note the repo README/CLAUDE.md still claim a Node 18 floor; that is
          # true for the plugin scripts but NOT for running the suite.
          node-version: '22'
          cache: 'npm'
      # `npm ci` needs the lockfile to match package.json; fall back so a lockfile drift reports as
      # a test failure rather than masquerading as an install failure.
      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Unit suite
        run: npm test
      # Typecheck is a SEPARATE, narrower gate: ci/tsconfig.json covers ci/*.ts + ci/lib/ +
      # scripts/**/*.ts only. Stated explicitly because a green "typecheck" on a change that is all
      # .mjs proves nothing about that change — a claim made, and wrongly relied on, in this very PR.
      - name: Typecheck (TypeScript sources only)
        run: npx tsc --noEmit -p ci/tsconfig.json
