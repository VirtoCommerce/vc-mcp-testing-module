# Drift gates for the repo's OWN instruction corpus and test-data contracts.
#
# WHY THIS EXISTS (agentic-system audit, 2026-09-07/08). The repo declares eleven `*:check` / `*:lint`
# drift gates and, until this file, wired EIGHT of them into no workflow at all — so `map:check` was red
# on a clean checkout, `td:validate` was red on one wildcard token, and nobody saw either. A guard nobody
# runs is a comment (unit-tests.yml says the same about `npm test`).
#
# Two jobs, split by what they need:
#   offline  — reads only the checkout. Runs on every PR and push to main. A red here blocks the PR.
#   external — needs the network (vc-frontend clone, live GraphQL introspection, the storefront, the
#              release corpus). Runs weekly + on demand and never blocks a PR: a source being unreachable
#              is exit 2 on every one of these by convention, and that is a fact about the network, not
#              about the change under review. Its red is a notification, not a gate.
name: Drift gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00 UTC — the external set only
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  offline:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      # THE GATES BELOW READ THE KNOWLEDGE BASE. The oracles, domain maps and API references moved
      # into VirtoCommerce/vc-knowledge (migration phase 4.1) — what makes them untrue is a change in
      # the PLATFORM, not in this repository — so bl:lint, ecl:lint, domain:check and parts of
      # `npm test` need it fetched first. The repository is public, so this needs no token.
      #
      # It is a REAL dependency, not a convenience: before the move these files were in the checkout
      # and therefore always present. A runner that cannot reach the base fails HERE, loudly, rather
      # than letting a downstream gate report an absent corpus as a clean one.
      - name: kb sync — fetch the knowledge base the gates read
        run: node plugins/vc-kb/bin/kb.mjs sync
      # The always-loaded instruction budget (CLAUDE.md + .claude/rules/) and the doc-integrity ratchet.
      # This is the gate that stops the 2026-09 re-tiering from growing back.
      - name: context:check — always-loaded budget + doc ratchet
        run: npm run context:check
      - name: mirror:check — .claude ↔ plugins/vc-fix, declared forks only
        run: npm run mirror:check
      - name: qa-test:doclint — /qa-test command↔skill integrity
        run: npm run qa-test:doclint
      - name: suites:lint — manifest ↔ CSV sync, global case IDs, XREF-001
        run: npm run suites:lint
      - name: td:validate — every @td() resolves, no hardcoded GUIDs
        run: npm run td:validate
      # The 22 per-domain fixture drift guards. Until 2026-09-15 these ran in NO workflow — only the
      # generic resolver check above did — so the strongest check the repo owns over its fixture data
      # ran when someone remembered to type it. They are also what makes the unit-test ROI rule safe
      # (test-data-authoring.md §7a): once authors stop unit-testing declared fixture data, this is
      # the only thing left covering it. Known-red guards are listed in td-validate-all.mjs KNOWN_RED
      # with their reason rather than skipped silently.
      - name: td:validate:all — per-domain fixture drift guards
        run: npm run td:validate:all
      # RULE 1 of when-to-write-a-test.md, made executable: a change shipping no executable source may
      # not add a scripts/unit/ test. PR-only — it is a diff question, and `push` has no base to diff
      # against. The default checkout is shallow, so the base ref is fetched first; without it the
      # script exits 2 ("base unavailable", a checkout fact) rather than passing silently.
      - name: Fetch base ref for test:roi-check
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
      - name: test:roi-check — NO CODE ⇒ NO UNIT TEST
        if: github.event_name == 'pull_request'
        run: npm run test:roi-check -- --base "origin/${{ github.base_ref }}"
      - name: bl:lint / ecl:lint — oracle citation integrity
        run: npm run bl:lint && npm run ecl:lint
      # The BL oracle page is GENERATED from the 217 records in the base's normative plane. If it is
      # not exactly what they render, either somebody hand-edited a generated file or the renderer
      # changed — and a silent rewrite of 217 invariants is the one thing nobody reviews.
      - name: bl:render:check — the oracle page is what the records render
        run: npm run bl:render:check
      # The base is read by installs that do NOT have this repository. A page there citing
      # `regression/suites/…` or `/qa-exploratory` is pointing at something the reader cannot open,
      # and they have no way to tell that from a pointer they have not found yet.
      - name: knowledge:refs — base pages carry the internal-reference banner
        run: npm run knowledge:refs
      - name: suites:executability:check — determinism ratchet
        run: npm run suites:executability:check
      - name: scope:validate — critical-ui-scope ↔ suite manifest
        run: npm run scope:validate
      # vc-kb's own suite. It is the ONLY thing that says the port from vc-kb-lab broke nothing, and
      # until it ran here it was a comment (see this file's header). One of its assertions needs a
      # real corpus and SKIPS without one, which is what CI is: "nothing to measure against" and
      # "retrieval regressed" must not be the same red.
      - name: kb:test — the knowledge base tool
        run: npm run kb:test
      - name: kb:test:logger — the vendored question/tool logger
        run: npm run kb:test:logger

  external:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      # Each step reports independently; a failure here is a "go look", never a merge block.
      - name: tokens:check — design tokens vs vc-frontend
        run: npm run tokens:check
        continue-on-error: true
      - name: selectors:check — data-test-id surface vs vc-frontend
        run: npm run selectors:check
        continue-on-error: true
      - name: presets:check — theme preset names vs vc-frontend
        run: npm run presets:check
        continue-on-error: true
      - name: schema:check — GraphQL introspection reachable
        run: npm run schema:check
        continue-on-error: true
      - name: releases:check — release ledger vs upstream
        run: npm run releases:check
        continue-on-error: true
