name: Regression Tests

on:
  workflow_dispatch:
    inputs:
      suite_selection:
        description: 'Suites: smoke, full, critical, sprint, frontend, backend, or comma-separated IDs (01,04a,06)'
        required: true
        default: 'smoke'
        type: string
      environment:
        description: 'Test environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - staging
      max_budget:
        description: 'Max budget in USD'
        required: true
        default: '10.0'
        type: string
      max_turns:
        description: 'Max turns per suite'
        required: true
        default: '100'
        type: string
      model:
        description: 'Claude model'
        required: true
        default: 'claude-sonnet-4-5-20250929'
        type: choice
        options:
          - claude-sonnet-4-5-20250929
          - claude-opus-4-6
      max_parallel:
        description: 'Max parallel suites (1-3)'
        required: false
        default: '3'
        type: string
      suite_timeout_ms:
        description: 'Per-suite timeout in ms (default: 600000 = 10 min)'
        required: false
        default: '600000'
        type: string
  # schedule:
  #   - cron: '0 6 * * 1-5'  # Daily smoke: Mon-Fri at 6:00 AM UTC
  #   - cron: '0 2 * * 0'     # Weekly full regression: Sunday at 2:00 AM UTC

# Prevent overlapping runs for the same selection
concurrency:
  group: regression-${{ github.event.inputs.suite_selection || 'scheduled' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    env:
      # Resolve schedule-aware defaults
      SUITE_SELECTION: >-
        ${{
          github.event_name == 'workflow_dispatch' && inputs.suite_selection ||
          github.event.schedule == '0 6 * * 1-5' && 'smoke' ||
          github.event.schedule == '0 2 * * 0' && 'full' ||
          'smoke'
        }}
      TEST_ENVIRONMENT: >-
        ${{
          github.event_name == 'workflow_dispatch' && inputs.environment ||
          'qa'
        }}
      # Caps are DERIVED per suite from the manifest (ci/lib/suite-caps.ts) unless a
      # workflow_dispatch input forces them. The former scheduled defaults were
      # arithmetically unable to run the corpus:
      #   MAX_BUDGET_USD=80 vs `full`'s ~$144 need  -> `full` truncated 55-70% of its
      #     suites every single run and had never once finished
      #   MAX_TURNS=100 vs suite 078's 115 cases    -> truncated at ~16 cases, then
      #     reported as "not a real failure" (exit 2)
      #   SUITE_TIMEOUT_MS=600000 vs 078's 83 min   -> killed at 12% of its estimate
      # An empty value means "derive it"; run-regression.ts treats these as overrides.
      MAX_BUDGET_USD: >-
        ${{
          github.event_name == 'workflow_dispatch' && inputs.max_budget || ''
        }}
      MAX_TURNS: >-
        ${{
          github.event_name == 'workflow_dispatch' && inputs.max_turns || ''
        }}
      MODEL: >-
        ${{
          github.event_name == 'workflow_dispatch' && inputs.model ||
          'claude-sonnet-4-5-20250929'
        }}
      MAX_PARALLEL: >-
        ${{
          github.event_name == 'workflow_dispatch' && inputs.max_parallel ||
          '3'
        }}
      SUITE_TIMEOUT_MS: >-
        ${{
          github.event_name == 'workflow_dispatch' && inputs.suite_timeout_ms || ''
        }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Log run configuration
        run: |
          echo "=== Regression Run Configuration ==="
          echo "Trigger: ${{ github.event_name }}"
          echo "Suite Selection: ${{ env.SUITE_SELECTION }}"
          echo "Environment: ${{ env.TEST_ENVIRONMENT }}"
          echo "Max Budget: ${{ env.MAX_BUDGET_USD == '' && 'derived from manifest' || format('${0}', env.MAX_BUDGET_USD) }}"
          echo "Max Turns: ${{ env.MAX_TURNS == '' && 'derived per suite' || env.MAX_TURNS }}"
          echo "Model: ${{ env.MODEL }}"
          echo "Max Parallel: ${{ env.MAX_PARALLEL }}"
          echo "Suite Timeout: ${{ env.SUITE_TIMEOUT_MS == '' && 'derived per suite' || format('{0}ms', env.SUITE_TIMEOUT_MS) }}"

      # Deterministic, <40s, and it replaces the failure mode where suite 050m spent 245
      # minutes producing 105 BLOCKED verdicts because one account was declared with two
      # different password vars. validate-credentials.mjs was written for exactly that
      # incident (its header cites the 2026-07-29 sales-rep audit); td:reconcile adds live
      # catalog-root / role-account / overlay-GUID liveness.
      - name: Preflight — credential + test-data drift
        run: |
          set -o pipefail
          if ! npm run td:validate:credentials; then
            echo "::error title=Preflight failed::A credential declaration conflict was found. This is a CONFIG problem, not a test failure — nothing was run. Fix the declaration before re-triggering."
            exit 1
          fi
          if ! npm run td:reconcile; then
            echo "::error title=Preflight failed::Live test-data reconciliation failed (missing role account, stale overlay GUID, or unreachable env). This is a CONFIG/ENV problem, not a test failure — nothing was run."
            exit 1
          fi
        env:
          TEST_ENV: ${{ secrets.TEST_ENV || 'vcst' }}
          FRONT_URL: ${{ secrets.FRONT_URL }}
          BACK_URL: ${{ secrets.BACK_URL }}
          ADMIN: ${{ secrets.ADMIN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      # The CI container is ephemeral, so history.json only accumulates if we carry it
      # across runs. Without this, compute-metrics.ts's flaky rule (n >= 4 && crossings >= 3)
      # can never fire — it needs 4 runs of the same suite to compare.
      # mergeHistoryRows() is idempotent per (runId, suiteId) and 90-day windowed, so a
      # restore -> merge -> commit cycle is safe and needs no new logic.
      - name: Restore regression history
        uses: actions/cache/restore@v4
        with:
          path: |
            reports/regression/history.json
            reports/regression/history-ci-runs.json
          key: regression-history-${{ github.run_id }}
          restore-keys: |
            regression-history-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ci/Dockerfile
          tags: vc-regression:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run regression tests
        id: regression
        run: |
          docker run --rm \
            --shm-size=2gb \
            -e ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }} \
            -e SUITE_SELECTION="${{ env.SUITE_SELECTION }}" \
            -e TEST_ENVIRONMENT="${{ env.TEST_ENVIRONMENT }}" \
            -e MAX_BUDGET_USD="${{ env.MAX_BUDGET_USD }}" \
            -e MAX_TURNS="${{ env.MAX_TURNS }}" \
            -e MODEL="${{ env.MODEL }}" \
            -e MAX_PARALLEL="${{ env.MAX_PARALLEL }}" \
            -e SUITE_TIMEOUT_MS="${{ env.SUITE_TIMEOUT_MS }}" \
            -e FRONT_URL="${{ secrets.FRONT_URL }}" \
            -e BACK_URL="${{ secrets.BACK_URL }}" \
            -e VIRTO_START_FRONT="${{ secrets.VIRTO_START_FRONT }}" \
            -e VIRTO_START_BACK="${{ secrets.VIRTO_START_BACK }}" \
            -e ADMIN="${{ secrets.ADMIN }}" \
            -e ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
            -e USER_EMAIL="${{ secrets.USER_EMAIL }}" \
            -e USER_PASSWORD="${{ secrets.USER_PASSWORD }}" \
            -e USER2_EMAIL="${{ secrets.USER2_EMAIL }}" \
            -e USER2_PASSWORD="${{ secrets.USER2_PASSWORD }}" \
            -e USER_VIRTO="${{ secrets.USER_VIRTO }}" \
            -e USER_VIRTO_PASSWORD="${{ secrets.USER_VIRTO_PASSWORD }}" \
            -e STORE_ID="${{ secrets.STORE_ID }}" \
            -e SKYFLOW_VISA="${{ secrets.SKYFLOW_VISA }}" \
            -e SKYFLOW_MASTERCARD="${{ secrets.SKYFLOW_MASTERCARD }}" \
            -e SKYFLOW_EXPIRY="${{ secrets.SKYFLOW_EXPIRY }}" \
            -e SKYFLOW_CVV="${{ secrets.SKYFLOW_CVV }}" \
            -e CYBERSOURCE_CARD="${{ secrets.CYBERSOURCE_CARD }}" \
            -e CYBERSOURCE_EXPIRY="${{ secrets.CYBERSOURCE_EXPIRY }}" \
            -e CYBERSOURCE_CVV="${{ secrets.CYBERSOURCE_CVV }}" \
            -e AUTHORIZNET_CARD="${{ secrets.AUTHORIZNET_CARD }}" \
            -e AUTHORIZNET_EXPIRY="${{ secrets.AUTHORIZNET_EXPIRY }}" \
            -e AUTHORIZNET_CVV="${{ secrets.AUTHORIZNET_CVV }}" \
            -e DATATRANCE_MASTERCARD="${{ secrets.DATATRANCE_MASTERCARD }}" \
            -e DATATRANCE_EXPIRY="${{ secrets.DATATRANCE_EXPIRY }}" \
            -e DATATRANCE_CVV="${{ secrets.DATATRANCE_CVV }}" \
            -e DATATRANCE_OTP="${{ secrets.DATATRANCE_OTP }}" \
            -v ${{ github.workspace }}/test-results:/app/test-results \
            -v ${{ github.workspace }}/reports:/app/reports \
            vc-regression
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          # 0 = every suite ran and passed | 1 = real failure | 2 = truncated or never
          # attempted | 3 = infrastructure blocked.
          # Exit 2 used to be annotated "no real failures", which is how a suite that
          # covered 14% of its cases read as fine. Truncation means the coverage is
          # INCOMPLETE — that is a run to redo, not a run to wave through.
          if [ $EXIT_CODE -eq 2 ]; then
            echo "::error::COVERAGE INCOMPLETE — suites were cut off by a cap or never attempted. This run does not clear a green gate; see summary.json coverageComplete."
          elif [ $EXIT_CODE -eq 3 ]; then
            echo "::error::Infrastructure blocked one or more suites (env/data/credentials), so they tested nothing."
          fi
          exit $EXIT_CODE

      - name: Read run summary
        if: always()
        id: summary
        run: |
          SUMMARY_FILE=$(find reports/regression -name "summary.json" -type f | sort -r | head -1)
          if [ -n "$SUMMARY_FILE" ]; then
            PASS_RATE=$(jq -r '.passRate // 0' "$SUMMARY_FILE")
            TOTAL_COST=$(jq -r '.totalCostUsd // 0' "$SUMMARY_FILE")
            PASSED=$(jq -r '.passed // 0' "$SUMMARY_FILE")
            FAILED=$(jq -r '.failed // 0' "$SUMMARY_FILE")
            BLOCKED=$(jq -r '.blocked // 0' "$SUMMARY_FILE")
            TRUNCATED=$(jq -r '.truncated // 0' "$SUMMARY_FILE")
            DEFERRED=$(jq -r '.deferred // 0' "$SUMMARY_FILE")
            COMPLETE=$(jq -r '.coverageComplete // "unknown"' "$SUMMARY_FILE")
            PREDICTED=$(jq -r '.predictedMakespanMinutes // 0' "$SUMMARY_FILE")
            ACTUAL=$(jq -r '.actualWallClockMinutes // 0' "$SUMMARY_FILE")
            echo "pass_rate=$PASS_RATE" >> $GITHUB_OUTPUT
            echo "total_cost=$TOTAL_COST" >> $GITHUB_OUTPUT
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "blocked=$BLOCKED" >> $GITHUB_OUTPUT
            echo "summary_path=$SUMMARY_FILE" >> $GITHUB_OUTPUT
            echo "### Regression Results" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Pass Rate | ${PASS_RATE}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "| Blocked | $BLOCKED |" >> $GITHUB_STEP_SUMMARY
            echo "| Truncated (cut off by a cap) | $TRUNCATED |" >> $GITHUB_STEP_SUMMARY
            echo "| Deferred (never attempted) | $DEFERRED |" >> $GITHUB_STEP_SUMMARY
            echo "| Coverage complete | $COMPLETE |" >> $GITHUB_STEP_SUMMARY
            echo "| Wall clock | ${ACTUAL} min (predicted ${PREDICTED}) |" >> $GITHUB_STEP_SUMMARY
            echo "| Cost | \$${TOTAL_COST} |" >> $GITHUB_STEP_SUMMARY
            if [ "$COMPLETE" != "true" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "> **Coverage is incomplete.** Suites were cut off or never attempted, so a low failure count does NOT mean the corpus passed." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "::warning::No summary.json found"
          fi

      # Save the accumulated history so the NEXT run can restore it. Keyed by run_id with a
      # `regression-history-` restore prefix, so each run reads the newest previous cache and
      # writes its own — an append-only chain rather than a mutable key.
      - name: Save regression history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            reports/regression/history.json
            reports/regression/history-ci-runs.json
          key: regression-history-${{ github.run_id }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ env.SUITE_SELECTION }}-${{ github.run_number }}
          path: |
            test-results/
            reports/regression/
          retention-days: 60

      - name: Send Teams notification
        if: always()
        run: npx tsx ci/notify-teams.ts
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          RUN_STATUS: ${{ job.status }}
          REGRESSION_RUN_ID: ${{ steps.summary.outputs.summary_path && 'ci-' || '' }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          SUITE_SELECTION: ${{ env.SUITE_SELECTION }}
          TEST_ENVIRONMENT: ${{ env.TEST_ENVIRONMENT }}
